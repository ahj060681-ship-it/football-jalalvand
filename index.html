<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فوتبال جلالوند</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#07120e;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
padding:15px
}

.container{
max-width:950px;
margin:auto
}

.card{
background:#10271c;
border:1px solid #28513c;
border-radius:18px;
padding:20px;
margin-bottom:15px
}

h1{color:#35d07f}

input,select,button{
font:inherit;
border-radius:10px;
padding:11px;
margin:4px
}

input,select{
background:#07120e;
color:#fff;
border:1px solid #40604e
}

button{
border:0;
font-weight:bold;
cursor:pointer
}

.add{background:#35d07f;color:#062014}
.edit{background:#e0b84d;color:#171006}
.delete{background:#c74450;color:white}

.game-form{
display:grid;
grid-template-columns:1fr 80px 80px 1fr;
align-items:center;
gap:5px
}

.game-form select,
.game-form input{
width:100%;
margin:0
}

.center{text-align:center}

table{
width:100%;
border-collapse:collapse;
overflow:hidden
}

th,td{
padding:10px 5px;
border-bottom:1px solid #28513c;
text-align:center
}

th{color:#9db5a7}

.result{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
border-bottom:1px solid #28513c;
padding:12px 0
}

.result-score{
font-size:20px;
font-weight:bold;
color:#35d07f
}

@media(max-width:650px){

.game-form{
grid-template-columns:1fr 55px 55px 1fr
}

.game-form input{
padding:9px 4px
}

table{
font-size:12px
}

th,td{
padding:8px 2px
}
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>⚽ فوتبال جلالوند</h1>
<h3>🏆 لیگ محلی جلالوند</h3>
<p>مدیریت تیم‌ها • ثبت بازی • جدول لیگ • نتایج</p>
</div>


<!-- مدیریت تیم‌ها -->

<div class="card">

<h2>⚙️ مدیریت تیم‌ها</h2>

<input
id="teamInput"
placeholder="نام تیم جدید">

<button
class="add"
onclick="addTeam()">
➕ افزودن تیم
</button>

<div id="teamList"></div>

</div>


<!-- ثبت بازی -->

<div class="card">

<h2>⚽ ثبت بازی</h2>

<div class="game-form">

<select id="homeTeam"></select>

<input
id="homeScore"
type="number"
min="0"
value="0">

<input
id="awayScore"
type="number"
min="0"
value="0">

<select id="awayTeam"></select>

</div>

<div class="center">

<button
class="add"
onclick="addGame()">
➕ ثبت نتیجه بازی
</button>

</div>

</div>


<!-- جدول -->

<div class="card">

<h2>📊 جدول لیگ</h2>

<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>رتبه</th>
<th>تیم</th>
<th>بازی</th>
<th>برد</th>
<th>مساوی</th>
<th>باخت</th>
<th>گل زده</th>
<th>گل خورده</th>
<th>تفاضل</th>
<th>امتیاز</th>
</tr>

</thead>

<tbody id="leagueTable"></tbody>

</table>

</div>

</div>


<!-- نتایج -->

<div class="card">

<h2>📋 نتایج بازی‌ها</h2>

<div id="results"></div>

</div>

</div>


<script>

/* ---------------- تیم‌ها ---------------- */

const defaultTeams=[
"قبربابا",
"دوردشت",
"علیباقر",
"دره بادام",
"سرجوب",
"قمر",
"یاریجان",
"الکه",
"ده موسی",
"پرگلی",
"گلستان",
"زمان",
"تلل",
"سرائیلان",
"ده عباسیان",
"خوبیاران"
];

let teams=
JSON.parse(
localStorage.getItem("jalalvandTeams")
);

if(!teams){

teams=defaultTeams.map(name=>({
name:name,
played:0,
wins:0,
draws:0,
losses:0,
gf:0,
ga:0,
points:0
}));

}


/* ---------------- بازی‌ها ---------------- */

let games=
JSON.parse(
localStorage.getItem("jalalvandGames")
)||[];


/* ---------------- ذخیره ---------------- */

function save(){

localStorage.setItem(
"jalalvandTeams",
JSON.stringify(teams)
);

localStorage.setItem(
"jalalvandGames",
JSON.stringify(games)
);

render();

}


/* ---------------- مدیریت تیم ---------------- */

function addTeam(){

const input=
document.getElementById("teamInput");

const name=
input.value.trim();

if(!name){

alert("نام تیم را وارد کنید");

return;

}

if(
teams.some(t=>t.name===name)
){

alert("این تیم قبلاً وجود دارد");

return;

}

teams.push({

name:name,
played:0,
wins:0,
draws:0,
losses:0,
gf:0,
ga:0,
points:0

});

input.value="";

save();

}


function editTeam(index){

const name=
prompt(
"نام جدید تیم:",
teams[index].name
);

if(name&&name.trim()){

teams[index].name=
name.trim();

save();

}

}


function deleteTeam(index){

if(
!confirm(
"آیا می‌خواهی این تیم حذف شود؟"
)
)return;


/* حذف بازی‌های این تیم */

games=
games.filter(
g=>
g.home!==teams[index].name &&
g.away!==teams[index].name
);

teams.splice(index,1);

recalculate();

save();

}


/* ---------------- ثبت بازی ---------------- */

function addGame(){

const homeIndex=
document.getElementById("homeTeam").value;

const awayIndex=
document.getElementById("awayTeam").value;

const homeScore=
parseInt(
document.getElementById("homeScore").value
);

const awayScore=
parseInt(
document.getElementById("awayScore").value
);


if(
homeIndex===""||
awayIndex===""
){

alert("دو تیم را انتخاب کنید");

return;

}


if(homeIndex===awayIndex){

alert("یک تیم نمی‌تواند با خودش بازی کند");

return;

}


if(
isNaN(homeScore)||
isNaN(awayScore)||
homeScore<0||
awayScore<0
){

alert("نتیجه بازی صحیح نیست");

return;

}


games.push({

home:teams[homeIndex].name,
away:teams[awayIndex].name,
homeScore:homeScore,
awayScore:awayScore

});


recalculate();

save();

}


 /* ---------------- محاسبه جدول ---------------- */

function recalculate(){

teams.forEach(t=>{

t.played=0;
t.wins=0;
t.draws=0;
t.losses=0;
t.gf=0;
t.ga=0;
t.points=0;

});


games.forEach(game=>{

const home=
teams.find(t=>t.name===game.home);

const away=
teams.find(t=>t.name===game.away);

if(!home||!away)return;


home.played++;
away.played++;

home.gf+=game.homeScore;
home.ga+=game.awayScore;

away.gf+=game.awayScore;
away.ga+=game.homeScore;


if(
game.homeScore>
game.awayScore
){

home.wins++;
home.points+=3;
away.losses++;

}

else if(
game.homeScore<
game.awayScore
){

away.wins++;
away.points+=3;
home.losses++;

}

else{

home.draws++;
away.draws++;

home.points++;
away.points++;

}

});


/* مرتب‌سازی جدول */

teams.sort((a,b)=>{

const diffA=
a.gf-a.ga;

const diffB=
b.gf-b.ga;

if(b.points!==a.points)
return b.points-a.points;

if(diffB!==diffA)
return diffB-diffA;

return b.gf-a.gf;

});

}


/* ---------------- انتخاب تیم‌ها ---------------- */

function renderTeamSelects(){

const home=
document.getElementById("homeTeam");

const away=
document.getElementById("awayTeam");

home.innerHTML="";
away.innerHTML="";


teams.forEach((team,index)=>{

home.innerHTML+=
`<option value="${index}">
${team.name}
</option>`;

away.innerHTML+=
`<option value="${index}">
${team.name}
</option>`;

});

}


/* ---------------- نمایش تیم‌ها ---------------- */

function renderTeams(){

const list=
document.getElementById("teamList");

list.innerHTML="";


teams.forEach((team,index)=>{

list.innerHTML+=`

<div class="result">

<span>
${index+1}. ${team.name}
</span>

<div>

<button
class="edit"
onclick="editTeam(${index})">
✏️
</button>

<button
class="delete"
onclick="deleteTeam(${index})">
🗑️
</button>

</div>

</div>

`;

});

}


/* ---------------- نمایش جدول ---------------- */

function renderTable(){

const table=
document.getElementById("leagueTable");

table.innerHTML="";


teams.forEach((team,index)=>{

const diff=
team.gf-team.ga;

table.innerHTML+=`

<tr>

<td>${index+1}</td>

<td>${team.name}</td>

<td>${team.played}</td>

<td>${team.wins}</td>

<td>${team.draws}</td>

<td>${team.losses}</td>

<td>${team.gf}</td>

<td>${team.ga}</td>

<td>${diff}</td>

<td><b>${team.points}</b></td>

</tr>

`;

});

}


/* ---------------- نمایش نتایج ---------------- */

function renderResults(){

const box=
document.getElementById("results");

box.innerHTML="";


if(games.length===0){

box.innerHTML=
"<p>هنوز بازی‌ای ثبت نشده است.</p>";

return;

}


games.forEach((game,index)=>{

box.innerHTML+=`

<div class="result">

<span>
${game.home}
</span>

<span class="result-score">
${game.homeScore}
-
${game.awayScore}
</span>

<span>
${game.away}
</span>

<button
class="delete"
onclick="deleteGame(${index})">
🗑️
</button>

</div>

`;

});

}


/* ---------------- حذف بازی ---------------- */

function deleteGame(index){

if(
confirm(
"آیا این نتیجه حذف شود؟"
)
){

games.splice(index,1);

recalculate();

save();

}

}


/* ---------------- نمایش ---------------- */

function render(){

renderTeams();

renderTeamSelects();

renderTable();

renderResults();

}


recalculate();

save();

</script>

</body>
</html>
