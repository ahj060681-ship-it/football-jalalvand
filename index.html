<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فوتبال جلالوند</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07120e;color:#fff;font-family:Tahoma,Arial;padding:15px}
.container{max-width:950px;margin:auto}
.card{background:#10271c;border:1px solid #28513c;border-radius:18px;padding:20px;margin-bottom:15px}
h1{color:#35d07f}
input,select,button{font:inherit;border-radius:10px;padding:11px;margin:4px}
input,select{background:#07120e;color:#fff;border:1px solid #40604e}
button{border:0;font-weight:bold;cursor:pointer}
.add{background:#35d07f;color:#062014}
.edit{background:#e0b84d}
.delete{background:#c74450;color:white}
.game{background:#0b1b13;border:1px solid #28513c;border-radius:12px;padding:12px;margin:8px 0}
.game-line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.score{font-size:20px;font-weight:bold;color:#35d07f}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 4px;border-bottom:1px solid #28513c;text-align:center}
th{color:#9db5a7}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-grid>*{width:100%;margin:0}
.center{text-align:center}
@media(max-width:600px){
.form-grid{grid-template-columns:1fr}
table{font-size:11px}
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>⚽ فوتبال جلالوند</h1>
<h3>🏆 لیگ محلی جلالوند</h3>
<p>مدیریت تیم‌ها • برنامه مسابقات • نتایج • جدول لیگ</p>
</div>

<div class="card">
<h2>⚙️ مدیریت تیم‌ها</h2>
<input id="teamInput" placeholder="نام تیم جدید">
<button class="add" onclick="addTeam()">➕ افزودن تیم</button>
<div id="teamList"></div>
</div>

<div class="card">
<h2>📅 برنامه مسابقات</h2>

<div class="form-grid">
<select id="homeTeam"></select>
<select id="awayTeam"></select>

<input id="gameDate" type="date">
<input id="gameTime" type="time">
</div>

<div class="center">
<button class="add" onclick="addGame()">➕ افزودن مسابقه</button>
</div>

<div id="games"></div>
</div>

<div class="card">
<h2>📊 جدول لیگ</h2>

<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>رتبه</th>
<th>تیم</th>
<th>بازی</th>
<th>برد</th>
<th>مساوی</th>
<th>باخت</th>
<th>گل‌زده</th>
<th>گل‌خورده</th>
<th>تفاضل</th>
<th>امتیاز</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>
</div>

<div class="card">
<h2>📋 نتایج بازی‌ها</h2>
<div id="results"></div>
</div>

</div>

<script>

const defaultTeams=[
"قبربابا","دوردشت","علیباقر","دره بادام",
"سرجوب","قمر","یاریجان","الکه",
"ده موسی","پرگلی","گلستان","زمان",
"تلل","سرائیلان","ده عباسیان","خوبیاران"
];

let teams=JSON.parse(localStorage.getItem("jalalvandTeams"));

if(!teams){
teams=defaultTeams.map(name=>({
name,played:0,wins:0,draws:0,losses:0,
gf:0,ga:0,points:0
}));
}

let games=JSON.parse(localStorage.getItem("jalalvandGames"))||[];

function save(){
localStorage.setItem("jalalvandTeams",JSON.stringify(teams));
localStorage.setItem("jalalvandGames",JSON.stringify(games));
render();
}

function addTeam(){
let input=document.getElementById("teamInput");
let name=input.value.trim();

if(!name){
alert("نام تیم را وارد کنید");
return;
}

if(teams.some(t=>t.name===name)){
alert("این تیم قبلاً وجود دارد");
return;
}

teams.push({
name,played:0,wins:0,draws:0,losses:0,
gf:0,ga:0,points:0
});

input.value="";
save();
}

function editTeam(i){
let name=prompt("نام جدید تیم:",teams[i].name);

if(name&&name.trim()){
let old=teams[i].name;
let n=name.trim();

games.forEach(g=>{
if(g.home===old)g.home=n;
if(g.away===old)g.away=n;
});

teams[i].name=n;
save();
}
}

function deleteTeam(i){
if(!confirm("این تیم و بازی‌هایش حذف شود؟"))return;

let name=teams[i].name;

games=games.filter(
g=>g.home!==name&&g.away!==name
);

teams.splice(i,1);

recalculate();
save();
}

function addGame(){

let h=document.getElementById("homeTeam").value;
let a=document.getElementById("awayTeam").value;
let date=document.getElementById("gameDate").value;
let time=document.getElementById("gameTime").value;

if(h===""||a===""){
alert("دو تیم را انتخاب کنید");
return;
}

if(h===a){
alert("یک تیم نمی‌تواند با خودش بازی کند");
return;
}

if(!date){
alert("تاریخ بازی را وارد کنید");
return;
}

games.push({
home:teams[h].name,
away:teams[a].name,
date,
time,
played:false,
homeScore:null,
awayScore:null
});

save();

document.getElementById("gameDate").value="";
document.getElementById("gameTime").value="";
}

function setResult(i){

let hs=prompt(
"گل‌های "+games[i].home+":",
games[i].homeScore??0
);

if(hs===null)return;

let as=prompt(
"گل‌های "+games[i].away+":",
games[i].awayScore??0
);

if(as===null)return;

hs=parseInt(hs);
as=parseInt(as);

if(isNaN(hs)||isNaN(as)||hs<0||as<0){
alert("نتیجه صحیح نیست");
return;
}

games[i].homeScore=hs;
games[i].awayScore=as;
games[i].played=true;

recalculate();
save();
}

function deleteGame(i){

if(confirm("این مسابقه حذف شود؟")){
games.splice(i,1);
recalculate();
save();
}
}

function recalculate(){

teams.forEach(t=>{
t.played=0;
t.wins=0;
t.draws=0;
t.losses=0;
t.gf=0;
t.ga=0;
t.points=0;
});

games.forEach(g=>{

if(!g.played)return;

let h=teams.find(t=>t.name===g.home);
let a=teams.find(t=>t.name===g.away);

if(!h||!a)return;

h.played++;
a.played++;

h.gf+=g.homeScore;
h.ga+=g.awayScore;

a.gf+=g.awayScore;
a.ga+=g.homeScore;

if(g.homeScore>g.awayScore){
h.wins++;
h.points+=3;
a.losses++;
}
else if(g.homeScore<g.awayScore){
a.wins++;
a.points+=3;
h.losses++;
}
else{
h.draws++;
a.draws++;
h.points++;
a.points++;
}
});

teams.sort((a,b)=>{
if(b.points!==a.points)
return b.points-a.points;

let dA=a.gf-a.ga;
let dB=b.gf-b.ga;

if(dB!==dA)return dB-dA;

return b.gf-a.gf;
});
}

function renderSelects(){

let h=document.getElementById("homeTeam");
let a=document.getElementById("awayTeam");

h.innerHTML="";
a.innerHTML="";

teams.forEach((t,i)=>{
h.innerHTML+=`<option value="${i}">${t.name}</option>`;
a.innerHTML+=`<option value="${i}">${t.name}</option>`;
});
}

function renderTeams(){

let box=document.getElementById("teamList");
box.innerHTML="";

teams.forEach((t,i)=>{
box.innerHTML+=`
<div class="game-line" style="padding:10px 0;border-bottom:1px solid #28513c">
<span>${i+1}. ${t.name}</span>
<span>
<button class="edit" onclick="editTeam(${i})">✏️</button>
<button class="delete" onclick="deleteTeam(${i})">🗑️</button>
</span>
</div>`;
});
}

function renderGames(){

let box=document.getElementById("games");
box.innerHTML="";

let upcoming=games.filter(g=>!g.played);

if(upcoming.length===0){
box.innerHTML="<p>هنوز مسابقه‌ای برای آینده ثبت نشده است.</p>";
return;
}

upcoming.forEach((g)=>{
let i=games.indexOf(g);

box.innerHTML+=`
<div class="game">
<div class="game-line">
<strong>${g.home}</strong>
<span>🆚</span>
<strong>${g.away}</strong>
</div>

<p>📅 ${g.date} ${g.time? "🕐 "+g.time:""}</p>

<button class="add" onclick="setResult(${i})">
⚽ ثبت نتیجه
</button>

<button class="delete" onclick="deleteGame(${i})">
🗑️ حذف
</button>
</div>`;
});
}

function renderTable(){

let box=document.getElementById("table");
box.innerHTML="";

teams.forEach((t,i)=>{

let diff=t.gf-t.ga;

box.innerHTML+=`
<tr>
<td>${i+1}</td>
<td>${t.name}</td>
<td>${t.played}</td>
<td>${t.wins}</td>
<td>${t.draws}</td>
<td>${t.losses}</td>
<td>${t.gf}</td>
<td>${t.ga}</td>
<td>${diff}</td>
<td><b>${t.points}</b></td>
</tr>`;
});
}

function renderResults(){

let box=document.getElementById("results");
box.innerHTML="";

let results=games.filter(g=>g.played);

if(results.length===0){
box.innerHTML="<p>هنوز نتیجه‌ای ثبت نشده است.</p>";
return;
}

results.forEach(g=>{
let i=games.indexOf(g);

box.innerHTML+=`
<div class="game">
<div class="game-line">
<strong>${g.home}</strong>
<span class="score">
${g.homeScore} - ${g.awayScore}
</span>
<strong>${g.away}</strong>
</div>

<p>📅 ${g.date} ${g.time? "🕐 "+g.time:""}</p>

<button class="edit" onclick="setResult(${i})">
✏️ ویرایش نتیجه
</button>

<button class="delete" onclick="deleteGame(${i})">
🗑️ حذف
</button>
</div>`;
});
}

function render(){
renderTeams();
renderSelects();
renderGames();
renderTable();
renderResults();
}

recalculate();
save();

</script>

</body>
</html>
