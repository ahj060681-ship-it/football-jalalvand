<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فوتبال جلالوند</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07120e;color:#fff;font-family:Tahoma,Arial;padding:15px}
.container{max-width:950px;margin:auto}
.card{background:#10271c;border:1px solid #28513c;border-radius:18px;padding:20px;margin-bottom:15px}
h1{color:#35d07f}
input,select,button{font:inherit;border-radius:10px;padding:11px;margin:4px}
input,select{background:#07120e;color:#fff;border:1px solid #40604e}
button{border:0;font-weight:bold;cursor:pointer}
.add{background:#35d07f;color:#062014}
.edit{background:#e0b84d}
.delete{background:#c74450;color:white}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #28513c;gap:8px}
.group{background:#0b1b13;border:1px solid #28513c;border-radius:14px;padding:12px;margin:10px 0}
.group h3{color:#35d07f}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 4px;border-bottom:1px solid #28513c;text-align:center}
th{color:#9db5a7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:#9db5a7}
.game{background:#0b1b13;border:1px solid #28513c;border-radius:12px;padding:12px;margin:8px 0}
@media(max-width:600px){.grid{grid-template-columns:1fr}table{font-size:11px}}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>⚽ فوتبال جلالوند</h1>
<h3>🏆 لیگ محلی جلالوند</h3>
<p>مدیریت تیم‌ها • گروه‌ها • مسابقات • نتایج • جدول</p>
</div>

<div class="card">
<h2>🗂️ مدیریت گروه‌ها</h2>

<div class="grid">
<input id="groupInput" placeholder="مثلاً گروه A">
<button class="add" onclick="addGroup()">➕ افزودن گروه</button>
</div>

<div id="groupList"></div>
</div>

<div class="card">
<h2>👥 مدیریت تیم‌ها</h2>

<input id="teamInput" placeholder="نام تیم جدید">

<button class="add" onclick="addTeam()">
➕ افزودن تیم
</button>

<div id="teamList"></div>
</div>

<div class="card">
<h2>📅 برنامه مسابقات</h2>

<div class="grid">

<select id="homeTeam"></select>
<select id="awayTeam"></select>

<input id="gameDate" type="date">
<input id="gameTime" type="time">

</div>

<button class="add" onclick="addGame()">
➕ افزودن مسابقه
</button>

<div id="games"></div>
</div>

<div class="card">
<h2>📊 جدول گروه‌ها</h2>
<div id="tables"></div>
</div>

<div class="card">
<h2>📋 نتایج بازی‌ها</h2>
<div id="results"></div>
</div>

</div>

<script>

const defaultTeams=[
"قبربابا","دوردشت","علیباقر","دره بادام",
"سرجوب","قمر","یاریجان","الکه",
"ده موسی","پرگلی","گلستان","زمان",
"تلل","سرائیلان","ده عباسیان","خوبیاران"
];

let groups=
JSON.parse(localStorage.getItem("jalalvandGroups"))
||["گروه A"];

let teams=
JSON.parse(localStorage.getItem("jalalvandTeams"));

if(!teams){

teams=defaultTeams.map(name=>({
name:name,
group:"گروه A",
played:0,
wins:0,
draws:0,
losses:0,
gf:0,
ga:0,
points:0
}));

}else{

teams=teams.map(t=>({
name:t.name,
group:t.group||"گروه A",
played:t.played||0,
wins:t.wins||0,
draws:t.draws||0,
losses:t.losses||0,
gf:t.gf||0,
ga:t.ga||0,
points:t.points||0
}));

}

let games=
JSON.parse(localStorage.getItem("jalalvandGames"))
||[];


function save(){

localStorage.setItem(
"jalalvandGroups",
JSON.stringify(groups)
);

localStorage.setItem(
"jalalvandTeams",
JSON.stringify(teams)
);

localStorage.setItem(
"jalalvandGames",
JSON.stringify(games)
);

render();
}


/* گروه‌ها */

function addGroup(){

let input=
document.getElementById("groupInput");

let name=input.value.trim();

if(!name){
alert("نام گروه را وارد کنید");
return;
}

if(groups.includes(name)){
alert("این گروه وجود دارد");
return;
}

groups.push(name);

input.value="";

save();
}


function renameGroup(index){

let old=groups[index];

let name=
prompt(
"نام جدید گروه:",
old
);

if(!name||!name.trim())return;

name=name.trim();

if(groups.includes(name)){
alert("این نام قبلاً وجود دارد");
return;
}

teams.forEach(t=>{
if(t.group===old){
t.group=name;
}
});

groups[index]=name;

save();
}


function deleteGroup(index){

if(groups.length===1){
alert("حداقل یک گروه باید وجود داشته باشد");
return;
}

let old=groups[index];

let target=
groups.find((g,i)=>i!==index);

if(!confirm(
"تیم‌های این گروه به «"+
target+
"» منتقل شوند؟"
))return;

teams.forEach(t=>{
if(t.group===old){
t.group=target;
}
});

groups.splice(index,1);

save();
}


/* تیم‌ها */

function addTeam(){

let input=
document.getElementById("teamInput");

let name=
input.value.trim();

if(!name){
alert("نام تیم را وارد کنید");
return;
}

if(teams.some(t=>t.name===name)){
alert("این تیم قبلاً وجود دارد");
return;
}

teams.push({

name:name,
group:groups[0],
played:0,
wins:0,
draws:0,
losses:0,
gf:0,
ga:0,
points:0

});

input.value="";

save();
}


function editTeam(index){

let old=teams[index].name;

let name=
prompt(
"نام جدید تیم:",
old
);

if(!name||!name.trim())return;

name=name.trim();

if(
teams.some(
(t,i)=>i!==index&&t.name===name
)
){

alert("این نام قبلاً وجود دارد");

return;

}

games.forEach(g=>{

if(g.home===old)
g.home=name;

if(g.away===old)
g.away=name;

});

teams[index].name=name;

save();
}


function moveTeam(index){

let current=teams[index].group;

let options=
groups.filter(g=>g!==current);

if(!options.length){

alert("گروه دیگری وجود ندارد");

return;

}

let name=
prompt(
"نام گروه مقصد را وارد کنید:\n\n"+
options.join("\n"),
options[0]
);

if(
name&&
options.includes(name)
){

teams[index].group=name;

save();

}

}


function deleteTeam(index){

let name=teams[index].name;

if(!confirm(
"تیم «"+name+
"» و بازی‌های آن حذف شود؟"
))return;

games=
games.filter(
g=>
g.home!==name &&
g.away!==name
);

teams.splice(index,1);

recalculate();

save();
}


/* مسابقات */

function addGame(){

let h=
document.getElementById("homeTeam").value;

let a=
document.getElementById("awayTeam").value;

let date=
document.getElementById("gameDate").value;

let time=
document.getElementById("gameTime").value;

if(h===""||a===""){

alert("دو تیم را انتخاب کنید");

return;
}

if(h===a){

alert(
"یک تیم نمی‌تواند با خودش بازی کند"
);

return;
}

if(!date){

alert("تاریخ بازی را وارد کنید");

return;
}

games.push({

home:teams[h].name,
away:teams[a].name,
date:date,
time:time,
played:false,
homeScore:null,
awayScore:null

});

save();

document.getElementById("gameDate").value="";
document.getElementById("gameTime").value="";
}


function setResult(index){

let game=games[index];

let hs=
prompt(
"گل‌های "+game.home+":",
game.homeScore??0
);

if(hs===null)return;

let as=
prompt(
"گل‌های "+game.away+":",
game.awayScore??0
);

if(as===null)return;

hs=parseInt(hs);
as=parseInt(as);

if(
isNaN(hs)||
isNaN(as)||
hs<0||
as<0
){

alert("نتیجه صحیح نیست");

return;

}

game.homeScore=hs;
game.awayScore=as;
game.played=true;

recalculate();

save();
}


function deleteGame(index){

if(
confirm("این مسابقه حذف شود؟")
){

games.splice(index,1);

recalculate();

save();

}

}


/* محاسبه جدول */

function recalculate(){

teams.forEach(t=>{

t.played=0;
t.wins=0;
t.draws=0;
t.losses=0;
t.gf=0;
t.ga=0;
t.points=0;

});


games.forEach(g=>{

if(!g.played)return;

let home=
teams.find(t=>t.name===g.home);

let away=
teams.find(t=>t.name===g.away);

if(!home||!away)return;

home.played++;
away.played++;

home.gf+=g.homeScore;
home.ga+=g.awayScore;

away.gf+=g.awayScore;
away.ga+=g.homeScore;

if(g.homeScore>g.awayScore){

home.wins++;
home.points+=3;
away.losses++;

}

else if(g.homeScore<g.awayScore){

away.wins++;
away.points+=3;
home.losses++;

}

else{

home.draws++;
away.draws++;

home.points++;
away.points++;

}

});

}


/* نمایش گروه‌ها */

function renderGroups(){

let box=
document.getElementById("groupList");

box.innerHTML="";

groups.forEach((g,i)=>{

box.innerHTML+=`

<div class="item">

<b>${g}</b>

<span>

<button
class="edit"
onclick="renameGroup(${i})">
✏️ تغییر نام
</button>

<button
class="delete"
onclick="deleteGroup(${i})">
🗑️ حذف
</button>

</span>

</div>

`;

});

}


/* نمایش تیم‌ها */

function renderTeams(){

let box=
document.getElementById("teamList");

box.innerHTML="";

teams.forEach((t,i)=>{

box.innerHTML+=`

<div class="item">

<span>
${i+1}. ${t.name}
<br>
<small class="muted">
گروه: ${t.group}
</small>
</span>

<span>

<button
class="edit"
onclick="moveTeam(${i})">
↔️ گروه
</button>

<button
class="edit"
onclick="editTeam(${i})">
✏️
</button>

<button
class="delete"
onclick="deleteTeam(${i})">
🗑️
</button>

</span>

</div>

`;

});

}


/* انتخاب تیم */

function renderSelects(){

let home=
document.getElementById("homeTeam");

let away=
document.getElementById("awayTeam");

home.innerHTML="";
away.innerHTML="";

teams.forEach((t,i)=>{

home.innerHTML+=
`<option value="${i}">
${t.name} — ${t.group}
</option>`;

away.innerHTML+=
`<option value="${i}">
${t.name} — ${t.group}
</option>`;

});

}


/* برنامه بازی‌ها */

function renderGames(){

let box=
document.getElementById("games");

let upcoming=
games.filter(g=>!g.played);

if(!upcoming.length){

box.innerHTML=
"<p class='muted'>مسابقه آینده‌ای ثبت نشده است.</p>";

return;

}

box.innerHTML="";

upcoming.forEach(g=>{

let i=games.indexOf(g);

box.innerHTML+=`

<div class="game">

<strong>
${g.home}
</strong>

<span> 🆚 </span>

<strong>
${g.away}
</strong>

<p>
📅 ${g.date}
${g.time?" 🕐 "+g.time:""}
</p>

<button
class="add"
onclick="setResult(${i})">
⚽ ثبت نتیجه
</button>

<button
class="delete"
onclick="deleteGame(${i})">
🗑️ حذف
</button>

</div>

`;

});

}


/* جدول گروه‌ها */

function renderTables(){

let box=
document.getElementById("tables");

box.innerHTML="";

groups.forEach(group=>{

let list=
teams
.filter(t=>t.group===group)
.sort((a,b)=>{

let da=a.gf-a.ga;
let db=b.gf-b.ga;

if(b.points!==a.points)
return b.points-a.points;

if(db!==da)
return db-da;

return b.gf-a.gf;

});


let html=`

<div class="group">

<h3>🏆 ${group}</h3>

`;

if(!list.length){

html+=
"<p class='muted'>این گروه تیمی ندارد.</p>";

}else{

html+=`

<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>رتبه</th>
<th>تیم</th>
<th>بازی</th>
<th>برد</th>
<th>مساوی</th>
<th>باخت</th>
<th>تفاضل</th>
<th>امتیاز</th>
</tr>

</thead>

<tbody>

`;

list.forEach((t,i)=>{

html+=`

<tr>

<td>${i+1}</td>

<td>${t.name}</td>

<td>${t.played}</td>

<td>${t.wins}</td>

<td>${t.draws}</td>

<td>${t.losses}</td>

<td>${t.gf-t.ga}</td>

<td>
<b>${t.points}</b>
</td>

</tr>

`;

});

html+=`

</tbody>
</table>
</div>

`;

}

html+=`</div>`;

box.innerHTML+=html;

});

}


/* نتایج */

function renderResults(){

let box=
document.getElementById("results");

let results=
games.filter(g=>g.played);

if(!results.length){

box.innerHTML=
"<p class='muted'>هنوز نتیجه‌ای ثبت نشده است.</p>";

return;

}

box.innerHTML="";

results.forEach(g=>{

let i=games.indexOf(g);

box.innerHTML+=`

<div class="game">

<strong>
${g.home}
</strong>

<span style="color:#35d07f;font-size:20px">
${g.homeScore} - ${g.awayScore}
</span>

<strong>
${g.away}
</strong>

<p>
📅 ${g.date}
${g.time?" 🕐 "+g.time:""}
</p>

<button
class="edit"
onclick="setResult(${i})">
✏️ ویرایش نتیجه
</button>

<button
class="delete"
onclick="deleteGame(${i})">
🗑️ حذف
</button>

</div>

`;

});

}


function render(){

renderGroups();
renderTeams();
renderSelects();
renderGames();
renderTables();
renderResults();

}


recalculate();
render();

</script>

</body>
</html>
